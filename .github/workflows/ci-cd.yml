name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  NODE_VERSION: '18'
  CACHE_VERSION: v1

jobs:
  # Code Quality & Security
  quality-checks:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint -- --format=json --output-file=eslint-report.json
      
    - name: Run TypeScript check
      run: npm run typecheck
      
    - name: Security audit
      run: npm audit --audit-level=high --json > audit-report.json || true
      
    - name: Upload quality reports
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports
        path: |
          eslint-report.json
          audit-report.json
        retention-days: 30

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run unit tests
      run: npm test -- --coverage --coverageReport=json --coverageReport=lcov
      
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          coverage/
          coverage.json
          coverage.lcov
        retention-days: 30
        
    - name: Upload to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.lcov
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Setup test environment
      run: |
        cp .env.example .env.test
        echo "NODE_ENV=test" >> .env.test
        echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:5432" >> .env.test
        echo "SUPABASE_SERVICE_ROLE_KEY=test-key" >> .env.test
        echo "REDIS_URL=redis://localhost:6379" >> .env.test
        echo "JWT_SECRET=test-jwt-secret-32-chars-long-minimum" >> .env.test
        echo "SESSION_SECRET=test-session-secret-32-chars-long-minimum" >> .env.test
        
    - name: Wait for services
      run: |
        timeout 60 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'
        timeout 60 bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 1; done'
        
    - name: Run database migrations
      run: npm run migrate
      
    - name: Run integration tests
      run: npm run test:integration
      env:
        NODE_ENV: test
        
    - name: Upload integration test reports
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-reports
        path: |
          test-results/
          coverage-integration/
        retention-days: 30

  # E2E Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright
      run: npx playwright install --with-deps
      
    - name: Build application
      run: npm run build
      
    - name: Start application
      run: |
        npm start &
        sleep 10
        
    - name: Run E2E tests
      run: npx playwright test
      
    - name: Upload E2E test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-reports
        path: |
          playwright-report/
          test-results/
        retention-days: 30

  # Build & Security Scan
  build:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    needs: [quality-checks, unit-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Security scan with Snyk
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
        
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          .next/
          dist/
        retention-days: 7

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [integration-tests, build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: ./
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install production dependencies
      run: npm ci --only=production
      
    - name: Deploy to Render
      uses: johnnymanzana/render-deploy@v1.0.0
      with:
        service-id: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
        render-api-key: ${{ secrets.RENDER_API_KEY }}
        
    - name: Run smoke tests
      run: |
        sleep 30
        curl -f https://job-apply-agent-staging.onrender.com/api/health || exit 1
        
    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always()

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [e2e-tests, build]
    if: github.event_name == 'release'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: ./
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install production dependencies
      run: npm ci --only=production
        
    - name: Deploy to Render
      uses: johnnymanzana/render-deploy@v1.0.0
      with:
        service-id: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
        render-api-key: ${{ secrets.RENDER_API_KEY }}
        
    - name: Run production smoke tests
      run: |
        sleep 30
        curl -f https://job-apply-agent.onrender.com/api/health || exit 1
        curl -f https://job-apply-agent.onrender.com/api/health -X POST || exit 1
        
    - name: Create deployment tag
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.git.createTag({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag: `v${context.payload.release.tag_name}`,
            message: `Production deployment v${context.payload.release.tag_name}`,
            object: context.sha,
            type: 'commit'
          })
          
    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        message: '🚀 Production deployment completed!'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always()

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install k6
      run: |
        sudo gpg -k /usr/share/keyrings/debian.gpg --dearmor > /usr/share/keyrings/debian.gpg
        echo "deb [signed-by=/usr/share/keyrings/debian.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6
        
    - name: Run performance tests
      run: |
        k6 run --out json=performance-results.json performance-tests/load-test.js
        
    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: performance-results.json
        retention-days: 30

  # Database Backup
  backup-database:
    name: Database Backup
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.event_name == 'release'
    
    steps:
    - name: Backup production database
      run: |
        curl -X POST "https://job-apply-agent.onrender.com/api/admin/backup" \
          -H "Authorization: Bearer ${{ secrets.ADMIN_API_KEY }}" || true
          
    - name: Upload backup to S3
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Upload backup file
      run: |
        aws s3 cp backup.sql s3://job-apply-agent-backups/$(date +%Y-%m-%d)/backup.sql || true

# Required status checks
  required-checks:
    name: Required Status Checks
    runs-on: ubuntu-latest
    if: always()
    needs: [quality-checks, unit-tests, integration-tests, build]
    
    steps:
    - name: Check all jobs passed
      run: |
        echo "Checking required status checks..."
        
        # Check if critical jobs passed
        if [ "${{ needs.quality-checks.result }}" != "success" ]; then
          echo "❌ Quality checks failed"
          exit 1
        fi
        
        if [ "${{ needs.unit-tests.result }}" != "success" ]; then
          echo "❌ Unit tests failed"
          exit 1
        fi
        
        if [ "${{ needs.integration-tests.result }}" != "success" ]; then
          echo "❌ Integration tests failed"
          exit 1
        fi
        
        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "❌ Build failed"
          exit 1
        fi
        
        echo "✅ All required checks passed"
        
    - name: Update status check
      uses: actions/github-script@v6
      with:
        script: |
          const { data: checks } = await github.rest.checks.listForRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.sha,
          });
          
          const requiredChecks = ['quality-checks', 'unit-tests', 'integration-tests', 'build'];
          const passedChecks = checks.checks.filter(check => 
            requiredChecks.includes(check.name) && check.conclusion === 'success'
          );
          
          if (passedChecks.length === requiredChecks.length) {
            console.log('✅ All required status checks passed');
          } else {
            console.log('❌ Some required checks failed');
            core.setFailed('Required status checks failed');
          }
